[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-graph-isomorph"
version = "1.0.0"
description = "Graph isomorphism with Weisfeiler-Lehman test"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "isomorphism", "graph", "weisfeiler-lehman", "algorithms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-graph-isomorph"
Repository = "https://github.com/ElNeMeR70/py-graph-isomorph"
